# Deployment: every push to main tests, applies infrastructure, and
# deploys the site — no manual steps.
#
# About `-auto-approve`: the project rule "never -auto-approve" applies
# to interactive use on a human's machine, where a person is present to
# read the plan. CI has no keyboard; its plan gate lives in the
# pull-request workflow instead, and main is only supposed to receive
# reviewed merges. The state lock plus the concurrency group below keep
# two applies from ever overlapping.

name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

# If two pushes land quickly, the second deploy waits for the first.
concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # A failing test stops everything below — broken code never ships.
      - name: Unit tests
        run: node --test backend/test/*.test.mjs

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::719857072816:role/studybuddy-timer-github-actions
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Apply infrastructure
        run: |
          set -o pipefail
          terraform -chdir=infra init -input=false 2>&1 | tee /tmp/tf-init.log
          terraform -chdir=infra apply -input=false -auto-approve 2>&1 | tee /tmp/tf-apply.log

      - name: Deploy the site
        run: ./scripts/deploy.sh 2>&1 | tee /tmp/site-deploy.log

      # Debuggability without GitHub access: when anything above fails,
      # park the logs in the PRIVATE state bucket (never served by
      # CloudFront) so they can be read with plain AWS credentials.
      - name: Upload logs on failure
        if: failure()
        run: |
          for f in /tmp/tf-init.log /tmp/tf-apply.log /tmp/site-deploy.log; do
            [ -f "$f" ] && aws s3 cp "$f" "s3://studybuddy-timer-tfstate-719857072816/ci-debug/$(basename $f)" || true
          done
