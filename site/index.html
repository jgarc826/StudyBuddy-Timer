<!DOCTYPE html>
<!--
  StudyBuddy Timer.
  This file is the page's STRUCTURE only. Looks live in style.css;
  behavior lives in the .js files loaded at the bottom.
  Deployed automatically by GitHub Actions on every push to main.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- On phones: render at device width instead of pretending to be a desktop. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyBuddy Timer</title>
  <!-- Tab icon embedded as a data: URL, so no extra image file is needed. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>StudyBuddy Timer</h1>
      <!-- Shown only in ?fast=1 test mode; JavaScript un-hides it. -->
      <span id="test-badge" class="test-badge" hidden>test mode — minutes are seconds</span>
    </header>

    <!-- The timer. The id attributes are unique handles; JavaScript finds
         elements by id, like looking up a widget in a GUI toolkit. -->
    <section class="card timer-card" aria-label="Timer">
      <p id="phase-label" class="phase-label">Ready to focus</p>
      <p id="clock" class="clock">50:00</p>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <div class="controls">
        <button id="start-btn" type="button" class="btn btn-primary">Start</button>
        <button id="pause-btn" type="button" class="btn" disabled>Pause</button>
        <button id="reset-btn" type="button" class="btn" disabled>Reset</button>
      </div>
    </section>

    <!-- Account: sign in / sign up. JavaScript hides this card once
         signed in, and shows the account row in the history card instead. -->
    <section class="card auth-card" id="auth-card" aria-label="Account">
      <h2 id="auth-title">Sign in</h2>
      <p class="auth-hint">Your study history follows your account — any browser, any device.</p>
      <form id="auth-form">
        <input id="auth-email" type="email" placeholder="email" autocomplete="email">
        <input id="auth-password" type="password" placeholder="password (8+ characters)" autocomplete="current-password">
        <input id="auth-code" type="text" placeholder="6-digit code from your email" inputmode="numeric" hidden>
        <button id="auth-submit" type="submit" class="btn btn-primary">Sign in</button>
      </form>
      <p class="auth-message" id="auth-message" hidden></p>
      <p class="auth-switch"><a href="#" id="auth-toggle">Need an account? Sign up</a></p>
    </section>

    <!-- Study history: total hours and the contribution grid. -->
    <section class="card history-card" aria-label="Study history">
      <div class="account-row" id="account-row" hidden>
        <span class="account-email" id="account-email"></span>
        <button id="signout-btn" type="button" class="btn btn-small">Sign out</button>
      </div>
      <h2>Your history</h2>
      <p id="total-line" class="total-line">No sessions yet.</p>

      <!-- GitHub-style contribution grid: one square per day, filled in by
           JavaScript. The scroller lets it scroll sideways on small screens. -->
      <div class="grid-scroller">
        <div id="grid-months" class="grid-months" aria-hidden="true"></div>
        <div id="grid" class="grid" aria-label="Daily study minutes, last 26 weeks"></div>
      </div>
      <div class="legend" aria-hidden="true">
        <span>Less</span>
        <div class="cell" data-level="0"></div>
        <div class="cell" data-level="1"></div>
        <div class="cell" data-level="2"></div>
        <div class="cell" data-level="3"></div>
        <div class="cell" data-level="4"></div>
        <span>More</span>
      </div>
    </section>
  </main>

  <!-- Behavior lives in separate files, loaded at the END of <body> so that
       every element above already exists when the scripts run. Order
       matters, like link order: config.js holds addresses, auth.js owns
       tokens, storage.js uses both, app.js uses everything. -->
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
